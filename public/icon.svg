<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="#334155" stroke-width="3" stroke-opacity="0.4" />
  
  <!-- Studio Clapperboard -->
  <g transform="translate(64, 90)">
    <!-- Slanted top clapper stick -->
    <g transform="rotate(-12, 192, 60)">
      <rect x="20" y="20" width="344" height="54" rx="8" fill="#1e293b" stroke="#475569" stroke-width="2" />
      <path d="M50 20 L80 74 L110 74 L80 20 Z" fill="url(#gold)" />
      <path d="M140 20 L170 74 L200 74 L170 20 Z" fill="url(#gold)" />
      <path d="M230 20 L260 74 L290 74 L260 20 Z" fill="url(#gold)" />
    </g>
    <!-- Base Board -->
    <rect x="20" y="80" width="344" height="230" rx="14" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <!-- Viewport / Canvas Window inside -->
    <rect x="36" y="96" width="312" height="150" rx="8" fill="#090d16" />
    
    <!-- Animation Frame / Stylus Motif -->
    <circle cx="192" cy="170" r="42" fill="url(#gold)" opacity="0.15" />
    <polygon points="182,145 218,170 182,195" fill="url(#gold)" />
    <circle cx="192" cy="170" r="54" fill="none" stroke="url(#gold)" stroke-width="2" stroke-dasharray="6 6" />

    <!-- Kazakh Sun/Eagle Inspired subtle curve flourish -->
    <path d="M120 280 Q 192 260 264 280" stroke="url(#gold)" stroke-width="3" fill="none" stroke-linecap="round" />
    <circle cx="192" cy="270" r="4" fill="url(#gold)" />

    <!-- Label -->
    <text x="192" y="300" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-weight="700" font-size="12" letter-spacing="3">STUDIO ACADEMY</text>
  </g>
</svg>